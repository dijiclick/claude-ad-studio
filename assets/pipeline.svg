  <g stroke="#b9b4c2" stroke-width="2" marker-end="url(#arr)">
    <line x1="217" y1="145" x2="234" y2="145"/>
    <line x1="424" y1="145" x2="441" y2="145"/>
    <line x1="631" y1="145" x2="648" y2="145"/>
    <line x1="838" y1="145" x2="855" y2="145"/>
    <line x1="1045" y1="145" x2="1062" y2="145"/>
  </g>
  <path d="M1157 222 C1157 280, 540 280, 540 224" fill="none" stroke="#ff5a36" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <text x="850" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#ff5a36">next batch = 5 new hooks on the winner</text>
  <text x="30" y="44" font-size="20" font-weight="800" fill="#1b1a21">The loop</text>
</svg>
