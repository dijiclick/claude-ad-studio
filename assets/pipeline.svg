<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="300" rx="20" fill="#fbfaf8"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9b4c2"/>
    </marker>
  </defs>
  <g font-size="15" fill="#1b1a21">
    <!-- step boxes: x positions 30, 237, 444, 651, 858, 1065 ; width 185 -->
    <g>
      <rect x="30" y="70" width="185" height="150" rx="16" fill="#fff" stroke="#e4e0ea" stroke-width="2"/>
      <text x="52" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">1 · FIND</text>
      <text x="52" y="134" font-size="19" font-weight="800">A winning ad</text>
      <text x="52" y="162" fill="#6b6776">Ranked by days</text>
      <text x="52" y="182" fill="#6b6776">running (30+)</text>
    </g>
    <g>
      <rect x="237" y="70" width="185" height="150" rx="16" fill="#fff" stroke="#e4e0ea" stroke-width="2"/>
      <text x="259" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">2 · DECONSTRUCT</text>
      <text x="259" y="134" font-size="19" font-weight="800">Frames + script</text>
      <text x="259" y="162" fill="#6b6776">Timed transcript,</text>
      <text x="259" y="182" fill="#6b6776">beat-by-beat</text>
    </g>
    <g>
      <rect x="444" y="70" width="185" height="150" rx="16" fill="#fff" stroke="#e4e0ea" stroke-width="2"/>
      <text x="466" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">3 · HOOKS</text>
      <text x="466" y="134" font-size="19" font-weight="800">5 lead types</text>
      <text x="466" y="162" fill="#6b6776">One shared body,</text>
      <text x="466" y="182" fill="#6b6776">5 openings</text>
    </g>
    <g>
      <rect x="651" y="70" width="185" height="150" rx="16" fill="#1b1a21" stroke="#1b1a21" stroke-width="2"/>
      <text x="673" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">4 · GATE</text>
      <text x="673" y="134" font-size="19" font-weight="800" fill="#fff">Realism check</text>
      <text x="673" y="162" fill="#c9c5d2">0 FAIL before</text>
      <text x="673" y="182" fill="#c9c5d2">any paid credit</text>
    </g>
    <g>
      <rect x="858" y="70" width="185" height="150" rx="16" fill="#fff" stroke="#e4e0ea" stroke-width="2"/>
      <text x="880" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">5 · GENERATE</text>
      <text x="880" y="134" font-size="19" font-weight="800">Veo 3.1 / Kling</text>
      <text x="880" y="162" fill="#6b6776">Same face in</text>
      <text x="880" y="182" fill="#6b6776">every clip</text>
    </g>
    <g>
      <rect x="1065" y="70" width="185" height="150" rx="16" fill="#fff" stroke="#e4e0ea" stroke-width="2"/>
      <text x="1087" y="104" font-size="13" font-weight="800" fill="#ff5a36" letter-spacing="1.5">6 · TEST</text>
      <text x="1087" y="134" font-size="19" font-weight="800">Data picks it</text>
      <text x="1087" y="162" fill="#6b6776">Hook rate + CPI,</text>
      <text x="1087" y="182" fill="#6b6776">scale the winner</text>
    </g>
